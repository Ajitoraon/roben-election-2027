<!DOCTYPE html>

<html>

<head>

<title>Download Card</title>

<link rel="stylesheet"
href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<style>

.id-card{

background:
linear-gradient(
to bottom,
#ff9933,
white,
green
);

padding:20px;

border-radius:20px;

margin-top:20px;

color:black;

box-shadow:0 0 15px rgba(0,0,0,0.4);

}

.card-header{

text-align:center;

font-size:30px;

font-weight:bold;

margin-bottom:20px;

}

.photo-section{

display:flex;

justify-content:center;

align-items:center;

gap:40px;

flex-wrap:wrap;

}

.photo-box{

text-align:center;

}

.photo-box img{

width:140px;

height:140px;

border-radius:50%;

border:5px solid white;

object-fit:cover;

background:white;

}

.member-details{

margin-top:25px;

font-size:22px;

line-height:40px;

text-align:center;

}

.thankyou{

margin-top:20px;

font-size:20px;

font-weight:bold;

text-align:center;

}

.print-btn{

margin-top:20px;

padding:15px 30px;

font-size:20px;

background:green;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

.print-btn:hover{

background:darkgreen;

}

@media print{

button{

display:none;

}

body{

background:white;

}

}

</style>

</head>

<body>

<div class="overlay">

<h1>Download Member Card</h1>

<input type="text"
id="searchName"
placeholder="Enter Name">

<input type="text"
id="searchID"
placeholder="Enter Member ID">

<br><br>

<button onclick="searchCard()">

Search Card

</button>

<div id="showCard"></div>

<br>

<a href="index.html">

<button>Home</button>

</a>

</div>

<script>

function searchCard(){

let name =
document.getElementById("searchName").value;

let id =
document.getElementById("searchID").value;

db.collection("members")

.where("memberID","==",Number(id))

.get()

.then((data)=>{

if(data.empty){

document.getElementById("showCard")

.innerHTML = `

<h2>

No Member Found

</h2>

`;

}

data.forEach((doc)=>{

let d = doc.data();

let memberPhoto = d.photo || "https://via.placeholder.com/140";

document.getElementById("showCard")

.innerHTML = `

<div class="id-card"
id="printArea">

<div class="card-header">

Roben Oraon Election 2027

</div>

<div class="photo-section">

<div class="photo-box">

<img src="roben.jpg">


<h3>

Roben Oraon

</h3>

<p>

Mukhiya Candidate

</p>

</div>

<div class="photo-box">

<img src="${memberPhoto}">

<h3>

${d.name}

</h3>

<p>

Registered Member

</p>

</div>

</div>

<div class="member-details">

<p>

<b>Member ID:</b>

${d.memberID}

</p>

<p>

<b>Father Name:</b>

${d.father}

</p>

<p>

<b>Mobile:</b>

${d.mobile}

</p>

<p>

<b>Address:</b>

${d.address}

</p>

</div>

<div class="thankyou">

“आपका विश्वास ही हमारी सबसे बड़ी ताकत है।  
आइए मिलकर पंचायत को विकास की नई ऊँचाई तक पहुँचाएँ।”

</div>

<center>

<button class="print-btn"
onclick="printCard()">

Print ID Card

</button>

</center>

</div>

`;

});

});

}

function printCard(){

window.print();

}

</script>

</body>

</html>
